{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block title %}Главная страница{% endblock title %}
{% block content %}

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
    {% for product in products %}
        <div class="col">
          <div class="card shadow-sm">
            <img src="{{product.image_product | media_filter}}" >

            <div class="card-body">
                <h3 class="card-title">{{ product.name_product }}</h3>
              <p class="card-text">{{ product.description_product | truncatechars:100 }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a href="  {% url 'catalog:product_detail' pk=product.pk %}" >Посмотреть</a>

                  <button type="button" class="btn btn-sm btn-outline-secondary">Редактировать</button>
                </div>

              </div>
            </div>
          </div>
        </div>

    {% endfor %}
</div>
{% endblock %}
