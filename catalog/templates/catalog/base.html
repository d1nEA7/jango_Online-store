<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}База{% endblock title %}</title>
    <!-- Подключение локального Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Боковая панель (занимает 2 колонки из 12) -->
            <div class="col-md-2 p-0">
                <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark vh-100">
                    <a href="/static" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                        <svg class="bi pe-none me-2" width="40" height="32"><use xlink:href="#bootstrap"></use></svg>
                        <span class="fs-4">Меню</span>
                    </a>
                    <hr>
                    <ul class="nav nav-pills flex-column mb-auto">
                        <!-- Главная -->
                        <li class="nav-item">
                            <!-- Проверяем: если url_name == 'home' (или как называется ваш путь главной), то ставим active -->
                            <a href="{% url 'catalog:products_list' %}" class="nav-link text-white {% if request.resolver_match.url_name == 'home' %}active{% endif %}" aria-current="page">
                                <svg class="bi pe-none me-2" width="16" height="16"><use xlink:href="#home"></use></svg>
                                Главная
                            </a>
                        </li>

                        <!-- Товары (если есть) -->
                        <li>
                            <a href="#" class="nav-link text-white">
                                <svg class="bi pe-none me-2" width="16" height="16"><use xlink:href="#table"></use></svg>
                                Товары
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link text-white">
                                <svg class="bi pe-none me-2" width="16" height="16"><use xlink:href="#grid"></use></svg>
                                Категории
                            </a>
                        </li>

                        <!-- Блоги -->
                        <li>
                            <!-- Проверяем: если в адресе есть namespace 'blogs' -->
                            <a href="{% url 'blogs:blog_list' %}" class="nav-link text-white {% if request.resolver_match.namespace == 'blogs' %}active{% endif %}">
                                <svg class="bi pe-none me-2" width="16" height="16"><use xlink:href="#file-earmark-text"></use></svg>
                                Блоги
                            </a>
                        </li>
                    </ul>
                    <hr>
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2">
                            <strong>mdo</strong>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#">New project...</a></li>
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Sign out</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Основной контент (занимает 10 колонок из 12) -->
            <main class="col-md-10 p-4">
                {% block content %}
                <!-- Сюда будет вставляться содержимое дочерних шаблонов -->
                {% endblock %}
            </main>
        </div>
    </div>

    <!-- Подключение Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
